name: ci

# Build/push the martian-bank service images to ghcr.io/srclos-net and bump
# the pinned tag in deploy/values-civo.yaml, which the Argo CD Application on
# fe-stackgen-run syncs automatically (GitOps).
#
# Build contexts follow the upstream layout: the Python services COPY
# protobufs/ from the repo root, so they build with context "." and
# -f <service>/Dockerfile; the Node/nginx services are self-contained.
#
# Guard against loops: images tagged from a "[ci-auto]" commit are identical
# to the previous run, so the guard step exits early on such commits.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          msg="$(git log -1 --format=%s)"
          echo "last commit: $msg"
          # Deploy-only changes (values, chart, manifests, policy, docs) must
          # NOT rebuild + re-pin images: a re-pin rolls every pod, which would
          # wreck the re:Invent booth loop (docs/reinvent/).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-only origin/${{ github.base_ref }}...HEAD)"
          else
            changed="$(git diff --name-only ${{ github.event.before }} HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)"
          fi
          echo "changed files:"; echo "$changed"
          code="$(echo "$changed" | grep -v -E '^(deploy/|docs/|policy/|martianbank/|\.github/)' | grep -v '^$' || true)"
          if echo "$msg" | grep -q '\[ci-auto\]'; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$code" ]; then
            echo "deploy-only change: skipping image builds"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  policy:
    # The capacity policy gate (policy/capacity.rego): renders the chart with
    # the cluster values exactly as Argo CD will, adds the raw manifests, and
    # runs conftest. Red = a workload ships without declared capacity.
    name: policy gate (capacity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install conftest
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz conftest
          sudo mv conftest /usr/local/bin/
      - name: Render Git state (what Argo CD will apply)
        run: |
          helm template martian-bank martianbank -f deploy/values-civo.yaml > rendered.yaml
          cat deploy/manifests/*.yaml >> rendered.yaml
      - name: conftest
        run: |
          conftest test rendered.yaml --policy policy --all-namespaces --output table | tee conftest.txt
          echo '### Capacity policy (conftest)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"; cat conftest.txt >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          ! grep -q FAIL conftest.txt

  images:
    runs-on: ubuntu-latest
    needs: guard
    if: needs.guard.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: ui,            context: ./ui,            file: ./ui/Dockerfile }
          - { name: nginx,         context: ./nginx,         file: ./nginx/Dockerfile }
          - { name: dashboard,     context: .,               file: ./dashboard/Dockerfile }
          - { name: accounts,      context: .,               file: ./accounts/Dockerfile }
          - { name: loan,          context: .,               file: ./loan/Dockerfile }
          - { name: transactions,  context: .,               file: ./transactions/Dockerfile }
          - { name: customer-auth, context: ./customer-auth, file: ./customer-auth/Dockerfile }
          - { name: atm-locator,   context: ./atm-locator,   file: ./atm-locator/Dockerfile }
          - { name: locust,        context: ./performance_locust, file: ./performance_locust/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.REGISTRY }}/srclos-net/martian-bank-demo-${{ matrix.service.name }}:sha-${{ needs.guard.outputs.sha }}
          provenance: false
          platforms: linux/amd64

      # NOTE: there is no REST endpoint to flip a package's visibility, and
      # org Settings → Packages' "Package Creation" policy governs what new
      # workflow-published packages are born as. Make packages public once
      # via the package's Package settings → Danger Zone → Change visibility
      # (public is one-way); this workflow cannot do it for you.

  bump-values:
    runs-on: ubuntu-latest
    needs: [guard, images]
    if: needs.guard.outputs.build == 'true' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Pin the pushed image tag in deploy/values-civo.yaml
        run: python3 .github/scripts/bump_values.py "${{ needs.guard.outputs.sha }}"
      - name: Commit and push the tag bump
        run: |
          sha="${{ needs.guard.outputs.sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit BEFORE the rebase: the bump script leaves a modified file,
          # and `git pull --rebase` refuses to run over unstaged changes.
          git add deploy/values-civo.yaml
          git commit -m "[ci-auto] pin images to sha-${sha} [skip ci]" || echo "nothing to commit"
          git pull --rebase --autostash origin main
          git push origin main

  shipyard-preview:
    # Per-PR ephemeral environment built by Shipyard from the repo's
    # docker-compose.yaml (repo must have a matching Application in the
    # Shipyard org). Green-with-warning until the SHIPYARD_API_TOKEN
    # repo secret exists. Shipyard does NOT push images: these are
    # throwaway preview stacks, not production artifacts.
    runs-on: ubuntu-latest
    needs: guard
    if: github.event_name == 'pull_request' && needs.guard.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Shipyard preview environment
        continue-on-error: true
        uses: shipyard/shipyard-action@1.0.0
        with:
          api-token: ${{ secrets.SHIPYARD_API_TOKEN }}
          timeout-minutes: 60

  pr-build:
    runs-on: ubuntu-latest
    needs: guard
    if: github.event_name == 'pull_request' && needs.guard.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: ui,            context: ./ui,            file: ./ui/Dockerfile }
          - { name: nginx,         context: ./nginx,         file: ./nginx/Dockerfile }
          - { name: dashboard,     context: .,               file: ./dashboard/Dockerfile }
          - { name: accounts,      context: .,               file: ./accounts/Dockerfile }
          - { name: loan,          context: .,               file: ./loan/Dockerfile }
          - { name: transactions,  context: .,               file: ./transactions/Dockerfile }
          - { name: customer-auth, context: ./customer-auth, file: ./customer-auth/Dockerfile }
          - { name: atm-locator,   context: ./atm-locator,   file: ./atm-locator/Dockerfile }
          - { name: locust,        context: ./performance_locust, file: ./performance_locust/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: false
          platforms: linux/amd64
