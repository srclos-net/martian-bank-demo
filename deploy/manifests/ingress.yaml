apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: martian-bank
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: bank.stackgen.run
    external-dns.alpha.kubernetes.io/target: 212.2.243.121
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: bank.stackgen.run
      http:
        paths:
          - backend:
              service:
                name: nginx
                port:
                  number: 8080
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - bank.stackgen.run
      secretName: bank-tls
