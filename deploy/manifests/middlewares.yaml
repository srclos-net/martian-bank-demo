# Runtime failure-injection knobs (Traefik 2.9.4, containo.us/v1alpha1).
# Deployed INERT — attach at runtime by patching the martian-bank Ingress'
# `traefik.ingress.kubernetes.io/router.middlewares` annotation; see
# docs/failure-playbook.md for flip commands.
# NOTE: latency injection lives in bank-latency.yaml (forwardAuth-delayer).
# Traefik 2.9.4 has no delay middleware in the binary ("invalid middleware
# type"), so that knob is not representable here.
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: bank-ratelimit
  labels:
    app.kubernetes.io/part-of: martian-bank
spec:
  # 5 req/s average, bursts of 10: beyond that customers get 429s.
  rateLimit:
    average: 5
    burst: 10
    period: 1s
---
apiVersion: traefik.containo.us/v1alpha1
kind: Middleware
metadata:
  name: bank-circuitbreaker
  labels:
    app.kubernetes.io/part-of: martian-bank
spec:
  # Passive: trips during storms by itself (3xx errors / slow 50th pct).
  # Attach only when you want the edge to start shedding load on its own.
  circuitBreaker:
    expression: NetworkErrorRatio() > 0.30 || LatencyAtQuantileMS(50) > 1500
