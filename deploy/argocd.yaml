apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: martian-bank
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/srclos-net/martian-bank-demo.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/srclos-net/martian-bank-demo.git
      targetRevision: main
      path: martianbank
      helm:
        valueFiles:
          - $values/deploy/values-civo.yaml
    - repoURL: https://github.com/srclos-net/martian-bank-demo.git
      targetRevision: main
      path: deploy/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: martian-bank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # The failure-playbook knobs (Traefik middleware attach/detach) are runtime
  # state: ignore just the middleware-attachment annotation so Argo self-heal
  # leaves the demo dials alone. External-dns/cert-manager annotations and the
  # ingress spec stay fully managed.
  ignoreDifferences:
    - group: networking.k8s.io
      kind: Ingress
      name: martian-bank
      jsonPointers:
        - /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
    - group: apps
      kind: Deployment
      name: bank-delayer
      # the chaos latency dial (DELAY_MS env) is live-tuned, not git state
      jsonPointers:
        - /spec/template/spec/containers/0/env
