apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: martian-bank
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/srclos-net/martian-bank-demo.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/srclos-net/martian-bank-demo.git
      targetRevision: main
      path: martianbank
      helm:
        valueFiles:
          - $values/deploy/values-civo.yaml
    - repoURL: https://github.com/srclos-net/martian-bank-demo.git
      targetRevision: main
      path: deploy/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: martian-bank
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
