# Copied verbatim from the hand-applied live ConfigMap (fe-stackgen-run).
# Argo CD (Application deploy/argocd-obi.yaml) owns this from now on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: obi-config
  namespace: devopsnow
data:
  obi-config.yml: |
    # Auto-instrument everything; exclude infra/self/monitoring namespaces.
    # devopsnow MUST be excluded: OBI runs there and would otherwise capture its
    # own OTEL export traffic (spans about spans = feedback loop).
    discovery:
      instrument:
        - k8s_namespace: "*"
      exclude:
        - k8s_namespace: kube-system
        - k8s_namespace: kube-public
        - k8s_namespace: kube-node-lease
        - k8s_namespace: devopsnow
        - k8s_namespace: signoz
        - k8s_namespace: datadog-ingest
        - k8s_namespace: argocd
        - k8s_namespace: cert-manager
        - k8s_namespace: external-dns
        - k8s_namespace: cnpg-system
        - k8s_namespace: harness-delegate-ng
        - k8s_namespace: puter
        - k8s_namespace: www
    attributes:
      kubernetes:
        enable: true
        cluster_name: fe-stackgen-run
    otel_traces_export:
      endpoint: http://otel-collector.devopsnow:4318
    otel_metrics_export:
      endpoint: http://otel-collector.devopsnow:4318
