# Copied verbatim from the hand-applied live ClusterRole (fe-stackgen-run).
# Argo CD (Application deploy/argocd-obi.yaml) owns this from now on.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obi
  labels:
    app.kubernetes.io/name: obi
rules:
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services", "nodes"]
    verbs: ["list", "watch"]
