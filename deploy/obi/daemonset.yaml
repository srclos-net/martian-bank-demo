# Copied from the hand-applied live DaemonSet (fe-stackgen-run), with ONE
# addition: OTEL_EBPF_BPF_CONTEXT_PROPAGATION=all.
#
# Why: OBI reads incoming trace context by default but does NOT inject it into
# outgoing requests (disabled by default upstream) — so every hop became its
# own orphan trace and the distributed traces looked sparse. This env enables
# network-level (HTTP/1 + plaintext HTTP/2/gRPC) header injection, tying the
# bank's client→server hops into single traces.
# See https://opentelemetry.io/docs/zero-code/obi/distributed-traces/
#
# Env var instead of the config YAML because the deployed image is
# v1.0.0 (pre config-v2) — the env var survives future image bumps.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: obi
  namespace: devopsnow
  labels:
    app.kubernetes.io/name: obi
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: obi
  updateStrategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: obi
    spec:
      hostPID: true
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists
      serviceAccountName: obi
      containers:
        - name: obi
          image: otel/ebpf-instrument:v1.0.0
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          terminationMessagePolicy: FallbackToLogsOnError
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: OTEL_EBPF_CONFIG_PATH
              value: /config/obi-config.yml
            - name: OTEL_EBPF_BPF_CONTEXT_PROPAGATION
              value: all
          volumeMounts:
            - mountPath: /config
              name: obi-config
            - mountPath: /var/run/obi
              name: var-run-obi
            - mountPath: /sys/kernel/tracing
              name: tracefs
      volumes:
        - configMap:
            name: obi-config
          name: obi-config
        - emptyDir: {}
          name: var-run-obi
        - hostPath:
            path: /sys/kernel/tracing
            type: Directory
          name: tracefs
