# Booth "Black Friday login rush" (docs/reinvent/). NOT an Argo CD source:
# `deploy/booth/booth blackfriday` applies it, `booth calm` deletes it.
# Pinned, deterministic load: CONCURRENCY workers doing real logins (bcrypt
# compare: CPU-bound in customer-auth) for at most DURATION seconds.
# With the 50m CPU hot-fix the login queue backs up to seconds; with the
# declared 1-CPU limit the same load stays well under the alert threshold.
apiVersion: batch/v1
kind: Job
metadata:
  name: booth-login-rush
  labels: {app.kubernetes.io/name: booth-login-rush, app.kubernetes.io/part-of: martian-bank}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 960
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: {app.kubernetes.io/name: booth-login-rush}
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 65534}
      containers:
        - name: rush
          image: python:3.12-slim
          env:
            - {name: TARGET, value: "http://customer-auth:8000/api/users"}
            - {name: CONCURRENCY, value: "3"}
            - {name: DURATION, value: "900"}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
          command:
            - python3
            - -u
            - -c
            - |
              import json, os, threading, time, urllib.request, urllib.error
              T = os.environ["TARGET"]; N = int(os.environ["CONCURRENCY"]); D = int(os.environ["DURATION"])
              USER = {"name": "Booth Visitor", "email": "booth-visitor@martian.bank", "password": "reinvent-1738"}
              def post(path, body, timeout=60):
                  req = urllib.request.Request(T + path, data=json.dumps(body).encode(),
                                               headers={"Content-Type": "application/json"}, method="POST")
                  t0 = time.time()
                  try:
                      with urllib.request.urlopen(req, timeout=timeout) as r: code = r.status
                  except urllib.error.HTTPError as e: code = e.code
                  except Exception: code = 0
                  return code, time.time() - t0
              print("register:", post("", USER)[0], "(400 = already exists)")
              lat, lock, stop = [], threading.Lock(), time.time() + D
              def worker():
                  while time.time() < stop:
                      code, dt = post("/auth", {"email": USER["email"], "password": USER["password"]})
                      with lock: lat.append((code, dt))
              for _ in range(N): threading.Thread(target=worker, daemon=True).start()
              while time.time() < stop:
                  time.sleep(15)
                  with lock: win, lat[:] = lat[:], []
                  ok = sorted(d for c, d in win if c == 200)
                  p = lambda q: ok[min(len(ok) - 1, int(q * len(ok)))] if ok else float("nan")
                  print(f"logins/15s={len(win)} ok={len(ok)} p50={p(.5):.2f}s p95={p(.95):.2f}s errors={len(win) - len(ok)}")
