# Overrides for the fe-stackgen-run Civo k3s cluster (deployed via Argo CD as https://bank.stackgen.run).
replicaCount: 1

SERVICE_PROTOCOL: http

# In-cluster MongoDB (deployed by the chart when mongodb.enabled=false).
DB_URL: "mongodb://root:example@mongodb:27017"

# customer-auth signs JWTs with a key pulled from a Secret that is created
# manually in the cluster (NOT in this repo — it is public). See deploy/README.md.
jwt:
  existingSecret: martianbank-jwt-secret

mongodb:
  enabled: false

nginx:
  enabled: true

locust:
  enabled: true
  alwaysOn: true
  users: 3

# The chart's built-in ingress template targets a service name that doesn't
# exist in this chart, so the real Ingress lives in deploy/manifests/.
ingress:
  enabled: false

# Capacity declared in Git (chart helper "martianbank.resources"). Policy
# (policy/capacity.rego) requires CPU+memory requests and limits on every
# workload, CPU limit >= 250m. Memory limits sit ~3x above the 7-day peak
# working set (ui runs the Vite dev server: ~3 GiB peak).
#
# The customer-auth entry lives between the booth markers: the re:Invent demo
# (docs/reinvent/) starts with it EMPTY (the GitOps blind spot), the InfraOps
# scan's PR fills it, and `deploy/booth/booth reset` empties it again.
capacity:
  ui:            {requests: {cpu: 100m, memory: 1Gi},   limits: {cpu: "1", memory: 4Gi}}
  nginx:         {requests: {cpu: 25m,  memory: 64Mi},  limits: {cpu: 500m, memory: 192Mi}}
  dashboard:     {requests: {cpu: 50m,  memory: 96Mi},  limits: {cpu: "1", memory: 384Mi}}
  accounts:      {requests: {cpu: 50m,  memory: 128Mi}, limits: {cpu: "1", memory: 384Mi}}
  loan:          {requests: {cpu: 50m,  memory: 128Mi}, limits: {cpu: "1", memory: 384Mi}}
  transactions:  {requests: {cpu: 50m,  memory: 128Mi}, limits: {cpu: "1", memory: 384Mi}}
  atm-locator:   {requests: {cpu: 50m,  memory: 96Mi},  limits: {cpu: "1", memory: 384Mi}}
  locust:        {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
  mongodb:       {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
  # >>> booth:customer-auth-capacity
  # <<< booth:customer-auth-capacity

autoscaling:
  enabled: false

# Pin the CI-built images (set by .github/workflows/ci.yml).
image:
  repository: ghcr.io/srclos-net/martian-bank-demo
  tag: sha-606cb85
